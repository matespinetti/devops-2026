nameOverride: orders
fullnameOverride: orders

global:
  projectName: retail-store

component: api

labels:
  team: "backend"
  owner: "matespinetti"

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-orders
  tag: "1.3.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: orders

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

externalServices:
  enabled: false
  services: []

containerPort: 8080

configMap:
  enabled: true
  data:
    PORT: "8080"
    RETAIL_ORDERS_PERSISTENCE_PROVIDER: "postgres"
    RETAIL_ORDERS_MESSAGING_PROVIDER: "sqs"
    RETAIL_ORDERS_PERSISTENCE_ENDPOINT: ""

envFrom:
  configMaps:
    - orders

env:
  - name: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: orders-secrets
        key: DB_HOST
  - name: RETAIL_ORDERS_PERSISTENCE_NAME
    valueFrom:
      secretKeyRef:
        name: orders-secrets
        key: DB_NAME
  - name: RETAIL_ORDERS_PERSISTENCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: orders-secrets
        key: DB_USER
  - name: RETAIL_ORDERS_PERSISTENCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: orders-secrets
        key: DB_PASS
  - name: RETAIL_ORDERS_MESSAGING_SQS_TOPIC
    valueFrom:
      secretKeyRef:
        name: orders-secrets
        key: SQS_QUEUE_URL

secretProviderClass:
  enabled: true
  name: orders-aws-secrets
  provider: aws

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

hpa:
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: "Percent"
          value: 100
          periodSeconds: 15
        - type: "Pods"
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: "Pods"
          value: 1
          periodSeconds: 60
