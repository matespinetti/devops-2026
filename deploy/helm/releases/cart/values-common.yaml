nameOverride: cart
fullnameOverride: cart

global:
  projectName: retail-store

component: api

labels:
  team: "backend"
  owner: "matespinetti"

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-cart
  tag: "1.3.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: cart

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

configMap:
  enabled: true
  data:
    PORT: "8080"
    RETAIL_CART_PERSISTENCE_PROVIDER: "dynamodb"
    RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: ""
    RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "false"

envFrom:
  configMaps:
    - cart

env:
  - name: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
    valueFrom:
      secretKeyRef:
        name: cart-items
        key: ITEMS_TABLE_NAME

secretProviderClass:
  enabled: true
  name: cart-aws-ssm
  provider: aws


startupProbe:
  enabled: true
  path: /actuator/health
  failureThreshold: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

hpa:
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: "Percent"
          value: 100
          periodSeconds: 15
        - type: "Pods"
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: "Pods"
          value: 1
          periodSeconds: 60
