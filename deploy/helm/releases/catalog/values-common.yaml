nameOverride: catalog
fullnameOverride: catalog

global:
  projectName: retail-store

component: api

labels:
  team: "backend"
  owner: "matespinetti"

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
  tag: "1.2.4"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: catalog

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

externalServices:
  enabled: false
  services: []

containerPort: 8080

configMap:
  enabled: true
  data:
    RETAIL_CATALOG_PERSISTENCE_PROVIDER: mysql
    RETAIL_CATALOG_PERSISTENCE_ENDPOINT: ""

envFrom:
  configMaps:
    - catalog
  secrets:
    - catalog-db

secretProviderClass:
  enabled: true
  name: catalog-aws-secrets
  provider: aws

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10

topologySpreadConstraints:

  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

hpa:
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: "Percent"
          value: 100
          periodSeconds: 15
        - type: "Pods"
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: "Pods"
          value: 1
          periodSeconds: 60
