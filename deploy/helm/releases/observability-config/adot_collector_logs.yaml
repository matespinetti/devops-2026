apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: adot-logs
spec:
  mode: daemonset
  serviceAccount: adot-collector

  #Inject noide name as env var
  env: 
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  # The Collector needs to run with high privileges to read /var/log/pods
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  

  # Allow running on all nodes including spot instances(runs every node)
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  volumes:
    - name: varlog
      hostPath:
        path: /var/log/pods 
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers

  volumeMounts:
    - name: varlog
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
  
  config:
    receivers:
      filelog:
        include: ["/var/log/pods/*/*/*.log"]
        exclude:
          - "/var/log/pods/kube-system_*/*/*.log"
          - "/var/log/pods/default_adot-*/*/*.log"
        start_at: end 
        include_file_path: true
        operators:
          - type: container
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 512 
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
        pod_association:
          - sources: 
            - from: resource_attribute
              name: k8s.pod.name 
      batch: 
        timeout: 10s
    exporters:
      awscloudwatchlogs:
        region: us-east-1
        log_group_name: "/aws/eks/retail-dev-eksdemo1/application"
        log_stream_name: "retail-store-ui"
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [awscloudwatchlogs]
            

        
    
    

