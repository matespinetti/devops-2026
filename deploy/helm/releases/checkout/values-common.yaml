nameOverride: checkout
fullnameOverride: checkout

global:
  projectName: retail-store

component: api

labels:
  team: "backend"
  owner: "matespinetti"

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-checkout
  tag: "1.3.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: checkout

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

configMap:
  enabled: true
  data:
    PORT: "8080"
    RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: "redis"
    RETAIL_CHECKOUT_ENDPOINTS_ORDERS: ""
    RETAIL_CHECKOUT_SHIPPING_NAME_PREFIX: ""

envFrom:
  configMaps:
    - checkout

env:
  - name: REDIS_HOST
    valueFrom:
      secretKeyRef:
        name: checkout-redis
        key: REDIS_HOST
  - name: REDIS_PORT
    valueFrom:
      secretKeyRef:
        name: checkout-redis
        key: REDIS_PORT
  - name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
    value: "redis://$(REDIS_HOST):$(REDIS_PORT)"

secretProviderClass:
  enabled: true
  name: checkout-aws-ssm
  provider: aws

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

hpa:
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: "Percent"
          value: 100
          periodSeconds: 15
        - type: "Pods"
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: "Pods"
          value: 1
          periodSeconds: 60
